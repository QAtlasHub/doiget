[workspace]
resolver = "2"
members = [
    "crates/doiget-core",
    "crates/doiget-cli",
    "crates/doiget-mcp",
]
exclude = [
    # Phase 7 optional, default OFF (see ADR-0008 / docs/SCOPE.md)
    "crates/doiget-obsidian",
    # cargo-fuzz harness — requires nightly toolchain (libfuzzer-sys),
    # so it lives outside the stable workspace. See
    # crates/doiget-core/fuzz/README.md and docs/SECURITY.md §1.1.
    "crates/doiget-core/fuzz",
]

[workspace.package]
version       = "0.8.13-beta.15"
edition       = "2021"
rust-version  = "1.86"
license       = "MIT"
repository    = "https://github.com/QAtlasHub/doiget"
homepage      = "https://github.com/QAtlasHub/doiget"
authors       = ["Sota Shimozono"]
keywords      = ["doi", "arxiv", "mcp", "academic", "openaccess"]
categories    = ["command-line-utilities", "science"]
readme        = "README.md"

# ---------------------------------------------------------------------
# Top-level features. The default release binary contains Tier 1 only.
#
# - Tier 1 (Open Access)            : always compiled in.
# - Tier 2 metadata (Phase 4)       : `metadata`.
# - Tier 3 TDM (Phase 5, opt-in build, never in published binaries):
#     `tdm-elsevier`, `tdm-aps`, `tdm-springer`, `tdm-ieee`. No `tdm-all` umbrella.
#
# See docs/SCOPE.md and docs/SOURCES.md.
# ---------------------------------------------------------------------
[workspace.metadata.doiget]
features-doc-link = "docs/SOURCES.md"

[workspace.dependencies]
# Core
doiget-core = { path = "crates/doiget-core", version = "0.8.13-beta.15" }
doiget-cli  = { path = "crates/doiget-cli", version = "0.8.13-beta.15" }
doiget-mcp  = { path = "crates/doiget-mcp", version = "0.8.13-beta.15" }

# Async runtime — features are deliberately limited (avoid `full`).
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread", "macros", "fs", "process", "signal",
    "io-util", "sync", "time",
] }

# CLI
clap = { version = "4", features = ["derive", "env", "string"] }

# Errors
thiserror = "2"
anyhow    = "1"

# Async-fn-in-trait shim. Native `async fn` in traits is stable since
# 1.75, but `#[async_trait::async_trait]` is still required to make
# the public `Source` trait dyn-compatible (`Box<dyn Source>`), since
# native dyn-safety for async fn in traits is unstable.
async-trait = "0.1"

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Secrets — see docs/CAPABILITY.md.
# IMPORTANT: any member crate inheriting this dep MUST also write
# `optional = true` in its own [dependencies], or `secrecy` becomes
# unconditionally compiled in (defeating the `tdm-*` feature gate from
# ADR-0002). `doiget-core/Cargo.toml` does this correctly.
secrecy = { version = "0.10", features = ["serde"] }

# HTTP client (rustls only — no openssl by deny.toml; see ADR-0020).
#
# reqwest 0.13's `rustls` feature bundles the **aws-lc-rs** crypto
# provider, whose `aws-lc-sys` build script needs a heavy C toolchain
# (cmake + nasm/go/clang). That makes `cargo install doiget-cli` fail on
# stock research/HPC boxes (e.g. Ubuntu 20.04 with only gcc+make) and
# fights musl-static cross-builds. We do NOT need FIPS or post-quantum,
# so we drop aws-lc-rs entirely:
#
#   reqwest `rustls-no-provider` = rustls backend + platform-verifier
#                                  roots, but NO bundled crypto provider
#                                  (caller installs the process default).
#   rustls `ring`                = the ring crypto provider (cc + perl
#                                  only — no cmake), installed as the
#                                  process default in `doiget-core`'s
#                                  `http` module before any client builds.
#
# Result: identical TLS posture (rustls-only, platform-verifier roots),
# but a pure cc/perl build that compiles anywhere. See ADR-0020
# Amendment 1 for the portability rationale.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider", "json", "gzip", "brotli", "stream",
] }
# Explicit rustls pin so the `ring` provider is compiled in and can be
# installed as the process default. `default-features = false` drops
# rustls's own aws_lc_rs default and `prefer-post-quantum` (aws-lc-rs
# only). Must stay version-compatible with the rustls reqwest resolves.
rustls = { version = "0.23", default-features = false, features = [
    "ring", "std", "tls12", "logging",
] }

# Filesystem
camino    = "1"
fs2       = "0.4"
tempfile  = "3"
# Cross-platform XDG / known-folder lookup for $HOME, $XDG_CONFIG_HOME,
# %USERPROFILE%, %APPDATA%, etc. Used by `doiget config` resolution.
# See docs/CONFIG.md §2.
dirs      = "6"

# Concurrency
parking_lot = "0.12"
once_cell   = "1"

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "1.1"
toml_edit   = "0.25"

# Time (always UTC; see docs/PROVENANCE_LOG.md)
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }

# Hashing — provenance log hash chain
sha2 = "0.11"
hex  = "0.4"

# gzip for provenance-log rotation (PROVENANCE_LOG.md §6). Pure-Rust
# `miniz_oxide` backend (`rust_backend`) — NO C toolchain, consistent
# with the ADR-0020 portability posture (cargo-installable / musl-static
# anywhere). MIT/Apache-2.0/Zlib — within deny.toml's allow list.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# tar extraction for arXiv TeX source (paper_tex_source). Pure-Rust, no C
# toolchain. MIT/Apache-2.0 — within deny.toml's allow list.
tar = "0.4"

# UUIDs / ULIDs (mcp_call_id, session_id)
uuid = { version = "1", features = ["v4", "serde"] }
ulid = { version = "3", features = ["serde"] }

# URL parsing — required, see docs/SECURITY.md §1.4
url = "2"

# XML parsing for arXiv Atom feed
# (`https://export.arxiv.org/api/query?id_list=...`). `quick-xml` is the
# de-facto standard streaming XML parser in the Rust ecosystem (push-style
# pull-parser, no DOM allocation). We deliberately avoid `serde-xml-rs`
# (deprecated) and `roxmltree` (DOM-style; heavier for the small Atom
# response). Default features (no `serde`, no `encoding`) are sufficient
# — we hand-roll a small event walker in `sources::arxiv`. Not on
# `deny.toml`'s banned list.
quick-xml = { version = "0.41", default-features = false }

# BibTeX / BibLaTeX bibliography input parser (ADR-0030 D2). Enabled in
# the default feature set — `.bib` is the dominant export format from
# Zotero / Mendeley / EndNote, and putting it behind a flag would mean
# `cargo install doiget-cli` lacks `.bib` support out of the box. ~500 KB
# compiled (~5% of the musl-static binary). MIT/Apache-2.0 — within
# deny.toml's allow list.
biblatex = "0.12"

# Byte buffer + async stream combinators for streaming-with-cap body reads
# (see crates/doiget-core/src/http.rs, docs/SECURITY.md §1.2 oversized PDF).
bytes        = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Test fixtures
wiremock    = "0.6"
assert_cmd  = "2"
predicates  = "3"
proptest    = "1"
# `serial_test` serialises env-mutating tests (DOIGET_*_BASE,
# DOIGET_STORE_ROOT, etc.) within a single test binary. Lifted to
# workspace deps in #228 review pass A6 so the three member crates
# (core / cli / mcp) cannot drift on the major version.
serial_test = "4"

# Phase 4 (citation graph)
petgraph = "0.6"

# MCP server SDK — official rust-sdk (`rmcp`). See ADR-0001 (stdio only).
#
# `default-features = false` is required: rmcp's defaults pull `base64`
# (unused — base64 binary blob support is not part of doiget's tool surface).
# We explicitly enable:
#   - `server`       : `ServerHandler` trait + tool dispatch.
#   - `macros`       : `#[tool_router]` / `#[tool]` / `#[tool_handler]`.
#   - `transport-io` : async stdin/stdout transport.
#   - `schemars`     : tool input-schema generation (the macros emit code
#                      that references `::rmcp::schemars::JsonSchema`).
#
# The streamable-http-* / oauth2 / jsonwebtoken / __reqwest features are
# deliberately omitted: ADR-0001 forbids any non-stdio transport, and
# `deny.toml` bans `axum` / `hyper::Server` / `openssl` / `native-tls`.
# A `cargo tree -p doiget-mcp` after the edit must NOT show any of those
# crates; `cargo deny check` enforces this in CI.
rmcp = { version = "3.1", default-features = false, features = [
    "server", "macros", "transport-io", "schemars",
] }

[workspace.lints.rust]
unsafe_code   = "forbid"
missing_docs  = "warn"

[workspace.lints.clippy]
print_stdout       = "deny"   # MCP stdio safety; see ADR-0001 / docs/SECURITY.md §3
print_stderr       = "warn"
unwrap_used        = "warn"
expect_used        = "warn"
panic              = "warn"
todo               = "warn"
unimplemented      = "warn"
dbg_macro          = "warn"

[profile.release]
lto             = "thin"
codegen-units   = 1
strip           = "symbols"
panic           = "abort"      # see ADR-0008

[profile.dev]
debug = "line-tables-only"

[profile.bench]
debug = false
lto   = "thin"
