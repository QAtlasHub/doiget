[package]
name          = "doiget-core"
description   = "Core library: Source/Store traits, CapabilityProfile, safekey, provenance log"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"

[lints]
workspace = true

[features]
default  = ["oa-only"]
oa-only  = []
metadata = []
citation = ["metadata"]

# Tier 3 — opt-in build only, never published. See ADR-0002.
tdm-elsevier = ["dep:secrecy"]
tdm-aps      = ["dep:secrecy"]
tdm-springer = ["dep:secrecy"]

[dependencies]
tokio       = { workspace = true }
thiserror   = { workspace = true }
async-trait = { workspace = true }
tracing     = { workspace = true }
secrecy     = { workspace = true, optional = true }
reqwest     = { workspace = true }
# Pulled in solely to install the `ring` crypto provider as the process
# default before any reqwest client is built (reqwest uses
# `rustls-no-provider` — no bundled provider). See ADR-0020 Amendment 1
# and `src/http.rs::ensure_crypto_provider`.
rustls      = { workspace = true }
camino      = { workspace = true, features = ["serde1"] }
fs2         = { workspace = true }
tempfile    = { workspace = true }
parking_lot = { workspace = true }
once_cell   = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
toml        = { workspace = true }
toml_edit   = { workspace = true }
chrono      = { workspace = true }
sha2        = { workspace = true }
hex         = { workspace = true }
flate2      = { workspace = true }
uuid        = { workspace = true }
ulid        = { workspace = true }
url         = { workspace = true }
bytes        = { workspace = true }
futures-util = { workspace = true }
# Streaming XML parser for the arXiv Atom feed. See B.1 in
# `crates/doiget-core/src/sources/arxiv.rs::parse_atom_feed`.
quick-xml    = { workspace = true }

[dev-dependencies]
wiremock     = { workspace = true }
proptest     = { workspace = true }
# Serializes tests that mutate process-global env state (used by the
# `CapabilityProfile::from_env` resolution tests, which call
# `std::env::set_var` / `remove_var`). See docs/CAPABILITY.md §2 and the
# `EnvGuard` RAII guard in `crates/doiget-core/src/lib.rs::tests`.
serial_test  = { workspace = true }
# `test-util` enables `tokio::test(start_paused = true)` and the
# `tokio::time::pause()` / `advance()` API used by rate_limiter tests.
tokio        = { workspace = true, features = ["test-util"] }
