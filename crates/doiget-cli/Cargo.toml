[package]
name          = "doiget-cli"
description   = "doiget CLI binary"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"

[[bin]]
name = "doiget"
path = "src/main.rs"

[lints]
workspace = true

[features]
default  = ["oa-only"]
oa-only  = ["doiget-core/oa-only"]
metadata = ["doiget-core/metadata"]
citation = ["doiget-core/citation"]
tdm-elsevier = ["doiget-core/tdm-elsevier"]
tdm-aps      = ["doiget-core/tdm-aps"]
tdm-springer = ["doiget-core/tdm-springer"]

[dependencies]
doiget-core        = { workspace = true }
clap               = { workspace = true }
anyhow             = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
# Enable the `serde1` feature here (workspace default omits it) so that
# `ResolvedConfig`'s `Utf8PathBuf` fields serialize for `config show`.
camino             = { workspace = true, features = ["serde1"] }
chrono             = { workspace = true }
# `doiget config` introspection — TOML serialization for `config show` and
# cross-platform $HOME / $XDG_CONFIG_HOME / %APPDATA% resolution.
# Also used by `doiget info` to re-serialize Metadata for stdout.
toml               = { workspace = true }
dirs               = { workspace = true }

[dev-dependencies]
assert_cmd  = { workspace = true }
predicates  = { workspace = true }
# `doiget config` tests mutate process-global env vars; serialize them.
serial_test = "3"
# `tempfile` lets `info` / `list-recent` e2e tests seed a per-test store root via
# DOIGET_STORE_ROOT instead of mutating the user's real `~/papers/`.
tempfile    = { workspace = true }
