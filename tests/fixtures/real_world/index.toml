# Master index for the slice-6 real-world fixture set.
#
# See README.md for curation policy, license caveats, and the refresh process.
# The driver test (crates/doiget-core/tests/real_world_fixtures_e2e.rs)
# walks [[entry]] rows in order. Set disabled = true on an entry to
# skip it (escape hatch when an upstream shape shifts and we need to
# keep CI green while updating the snapshot).
schema_version = "1"

# -- DOI / Crossref happy path: closed-access Nature news (no OA URL) --
[[entry]]
id                  = "10.1038-nature.2014.16080"
kind                = "doi-no-oa"
ref                 = "10.1038/nature.2014.16080"
notes               = "Nature news article -- Crossref returns metadata but link[] is empty, exercising the no-OA-available path."
provenance          = "hand-crafted"
last_refreshed_iso  = "2026-05-12"
crossref_response   = "doi/10.1038-nature.2014.16080/crossref.json"
expected            = "doi/10.1038-nature.2014.16080/expected.toml"

