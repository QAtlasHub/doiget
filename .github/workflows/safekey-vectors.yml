name: safekey-vectors

# Phase 0 final scope (Slice 3): validate that
# `tests/fixtures/safekey/vectors.json` is well-formed AND that the Rust
# implementation (`Ref::safekey`) produces bit-identical output for every
# one of the 100 NORMATIVE entries via the in-crate
# `safekey_matches_reference_vectors` unit test
# (`crates/doiget-core/src/lib.rs::tests`).
#
# The cross-tool parity check against the Julia reference implementation
# (BiblioFetch.jl) remains DEFERRED to Phase 2, gated on the
# BiblioFetch.jl pre-flight item under `docs/PHASES.md` §2 ("Pre-flight
# items"). Phase 2 will add a separate job that diffs the Julia output
# against the same fixture; the Rust side does not change when that
# lands.

on:
  pull_request:
    paths:
      - "tests/fixtures/safekey/**"
      - ".github/workflows/safekey-vectors.yml"
      - "crates/doiget-core/src/lib.rs"
      - "crates/doiget-core/src/safekey/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "tests/fixtures/safekey/**"
      - ".github/workflows/safekey-vectors.yml"
      - "crates/doiget-core/src/lib.rs"
      - "crates/doiget-core/src/safekey/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: safekey-vectors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate vectors.json schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2

      - name: Validate vectors.json schema
        shell: bash
        env:
          VECTORS: tests/fixtures/safekey/vectors.json
        run: |
          set -euo pipefail

          # `jq` is preinstalled on ubuntu-latest runners; assert that to keep
          # the failure mode obvious if GitHub ever changes the image.
          command -v jq >/dev/null || { echo "::error::jq not available on runner"; exit 1; }

          if [[ ! -f "$VECTORS" ]]; then
            echo "::error::missing fixture: $VECTORS"
            exit 1
          fi

          # 1. File must be parseable JSON.
          if ! jq -e . "$VECTORS" >/dev/null; then
            echo "::error::$VECTORS is not valid JSON"
            exit 1
          fi

          # 2. Root must be an object containing a non-empty `vectors` array.
          #    Schema reflects the actual shape of the Phase 0 fixture
          #    (top-level keys: _comment, version, notes, vectors).
          if ! jq -e 'type == "object" and (.vectors | type == "array") and (.vectors | length > 0)' \
                "$VECTORS" >/dev/null; then
            echo "::error::$VECTORS root must be an object with a non-empty 'vectors' array"
            exit 1
          fi

          # 3. Every entry must have exactly the keys declared in
          #    docs/SAFEKEY.md §3: { input: <string>, expected: <string> }.
          #    Extra keys are rejected so drift in the fixture surfaces here
          #    rather than silently breaking the Phase 1 parity test.
          BAD=$(jq -r '
            .vectors
            | to_entries[]
            | select(
                (.value | type != "object")
                or (.value.input    | type != "string")
                or (.value.expected | type != "string")
                or ((.value | keys | sort) != ["expected", "input"])
              )
            | .key
          ' "$VECTORS")
          if [[ -n "$BAD" ]]; then
            echo "::error::$VECTORS has malformed entries at indices: $BAD"
            echo "          required schema per docs/SAFEKEY.md §3:"
            echo "            { \"input\": <string>, \"expected\": <string> }"
            exit 1
          fi

          # 4. Report entry count for visibility in the run log + step summary.
          #    Slice 3 ships the NORMATIVE 100-entry set (docs/SAFEKEY.md §5);
          #    deviation from 100 indicates a fixture-edit regression.
          COUNT=$(jq '.vectors | length' "$VECTORS")
          if [[ "$COUNT" != "100" ]]; then
            echo "::error::$VECTORS must contain exactly 100 entries (NORMATIVE per docs/SAFEKEY.md §5); got $COUNT"
            exit 1
          fi
          echo "vectors.json: $COUNT entries OK"
          {
            echo "## safekey vectors"
            echo
            echo "- file: \`$VECTORS\`"
            echo "- entries: **$COUNT**"
            echo "- schema: \`{ input: string, expected: string }\` per docs/SAFEKEY.md §3"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust toolchain (MSRV via rust-toolchain.toml)
        # No explicit version pin needed: the workspace `rust-toolchain.toml`
        # declares the channel (stable) and the MSRV (1.86). dtolnay's
        # toolchain action honors that file when no toolchain input is set.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8   # stable, 2025-10-23

      - name: cargo test safekey_matches_reference_vectors
        # The Rust parity test loads tests/fixtures/safekey/vectors.json via
        # include_str! and asserts Ref::safekey output matches `expected` for
        # all 100 NORMATIVE entries (per docs/SAFEKEY.md §5). The test is a
        # unit test inside doiget-core's lib.rs, hence `--lib`. We also run
        # the long-input truncation test in the same invocation by filtering
        # on the `safekey_` prefix.
        run: cargo test -p doiget-core --lib --no-default-features --features oa-only safekey_
