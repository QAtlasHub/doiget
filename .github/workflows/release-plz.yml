name: release

# FILENAME NOTE (ADR-0025 amendment, 2026-05-18): this workflow is
# intentionally kept at `.github/workflows/release-plz.yml` even though
# release-plz itself was removed. The crates.io OIDC Trusted Publisher for
# doiget-core / doiget-cli / doiget-mcp is bound to (repo, workflow filename)
# = `release-plz.yml` (it is NOT environment-scoped). Renaming the file would
# require re-registering the Trusted Publisher for all three crates on
# crates.io before the next publish. The filename is a deliberate, documented
# misnomer; the contents are the ADR-0025 tag-driven pipeline below.

# ADR-0025 — tag-driven release pipeline. The ONLY entry point is pushing an
# annotated, GPG-signed workspace tag `vX.Y.Z` (stable) or `vX.Y.Z-beta.N`
# (beta). One workspace tag IS the release; the legacy per-crate
# `doiget-<crate>-v*` tag scheme (release-plz) is retired.
#
# Job order — each gates the next; the entire reversible gate precedes the
# first irreversible action (`cargo publish`), per ADR-0025 D5:
#
#   version-gate  -> publish -> (sign, sbom, github-release)
#
#   * version-gate : scripts/release-version-gate.sh (ADR-0025 D2, G0–G7).
#                    If it fails NOTHING else runs (nothing external happens).
#   * publish      : cargo publish doiget-core, then doiget-cli + doiget-mcp,
#                    --locked, via OIDC trusted publishing (NO token — the same
#                    auth model the removed release-plz.yml used: `id-token:
#                    write` + crates.io Trusted Publisher registration; there
#                    is NO `CARGO_REGISTRY_TOKEN` secret). Idempotent up to the
#                    first already-published crate (ADR-0025 D5) so a re-run
#                    after a partial publish continues instead of hard-failing.
#   * sign / sbom  : the cosign-keyless binary signing + CycloneDX SBOM logic
#                    folded in from release-sign.yml / release-sbom.yml.
#   * github-release: GitHub Release whose body is exactly the extracted
#                    `## [X.Y.Z]` CHANGELOG section; prerelease iff the tag
#                    carries a SemVer pre-release identifier.
#
# SIGN/SBOM FOLD DECISION: the binary-signing and SBOM steps are folded into
# THIS workflow as the `sign` and `sbom` jobs (gated on `publish`), so one tag
# produces exactly ONE coherent pipeline. release-sign.yml and release-sbom.yml
# are changed to `workflow_dispatch`-only and their `push: tags:
# doiget-cli-v*` trigger is REMOVED — otherwise they would double-fire (and on
# a now-retired per-crate tag pattern). They are kept solely as manual
# re-sign / re-SBOM escape hatches for an already-published version.
#
# `workflow_dispatch` (with a `tag` input) mirrors release-sign.yml's dispatch
# pattern so a maintainer can re-run the pipeline against an existing tag
# (e.g. after a transient crates.io / sigstore failure); the version gate's
# already-published check (D2-G3) + the publish idempotency guard make that
# safe.
#
# All third-party Actions are SHA-pinned, not tag-pinned (repo invariant /
# ADR-0013 supply-chain posture, still binding). Workflow + per-job
# permissions are least-privilege, mirroring release-plz.yml's posture
# (workflow-level `contents: read`; jobs widen only what they need;
# `id-token: write` only on the jobs that mint an OIDC token).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z[-beta.N] tag to (re)run the release pipeline for'
        required: true
        type: string

# Least common denominator (mirrors release-plz.yml). Jobs narrow/widen below.
permissions:
  contents: read

# One global lock per tag — never let two release runs race for the same
# tag / publish / GitHub Release.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # For a `push: tags` run this is the tag ref name; for manual dispatch it is
  # the user-supplied tag input. Used by every job.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # -------------------------------------------------------------------------
  # a. version-gate — runs FIRST. If it fails, NOTHING else runs (no publish,
  #    no sign, no SBOM, no GitHub Release). ADR-0025 D2 / D5: the entire
  #    abortable gate precedes the first irreversible action.
  # -------------------------------------------------------------------------
  version-gate:
    name: version gate (ADR-0025 D2)
    runs-on: ubuntu-latest
    permissions:
      contents: read   # only reads the repo + git tag object
    steps:
      - name: Checkout full history (gate needs tags + lane branches)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0          # G4 (published history) + G7 (branch reachability)
          ref: ${{ env.TAG }}     # the tagged commit
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - name: Fetch lane branches for G7 reachability
        shell: bash
        run: |
          set -euo pipefail
          # G7 checks the tag is reachable from its lane branch (beta⇒next,
          # stable⇒main). A tag checkout is detached; fetch the branch refs.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' || true
          git fetch --no-tags origin '+refs/heads/next:refs/remotes/origin/next' || true
      - name: Run the version gate (G0–G7, NO offline skip — CI runs every check)
        shell: bash
        run: bash scripts/release-version-gate.sh "$TAG"

  # -------------------------------------------------------------------------
  # b. publish — cargo publish in dependency order: doiget-core first, then
  #    doiget-cli + doiget-mcp (which depend on core). OIDC trusted publishing,
  #    NO token — the same auth model release-plz.yml used (`id-token: write`,
  #    crates.io Trusted Publisher; no `CARGO_REGISTRY_TOKEN`). release-plz
  #    performed the OIDC↔crates.io token exchange internally inside
  #    `release-plz/action`; we do it explicitly with the Rust project's
  #    canonical SHA-pinned `crates-io-auth-action`, which is the same exchange.
  # -------------------------------------------------------------------------
  publish:
    name: cargo publish (OIDC trusted publishing)
    runs-on: ubuntu-latest
    needs: version-gate
    permissions:
      contents: read
      id-token: write   # OIDC: exchange GitHub token for short-lived crates.io token
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.TAG }}
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - name: Exchange OIDC token for a crates.io publish token
        # There is deliberately NO CARGO_REGISTRY_TOKEN secret — the
        # `id-token: write` permission above lets this mint a short-lived
        # crates.io token from the GitHub OIDC token, identical to how the
        # removed release-plz.yml's `release` job authenticated (release-plz
        # did this exchange inside its own action). Each crate must be
        # registered as a Trusted Publisher on crates.io before the first run.
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe  # v1.0.4
        id: auth
      - name: Publish doiget-core then doiget-cli + doiget-mcp (idempotent)
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # Per-crate sequential publish in dependency order: core first
          # (cli + mcp depend on it). --locked: publish exactly the resolved
          # Cargo.lock the gate validated. ADR-0025 D5 idempotency: a re-run
          # that finds a crate ALREADY on crates.io (immutable) must CONTINUE
          # to the next crate, not hard-fail — recovery from a partial publish
          # is a re-run, never a force-overwrite.
          publish_one() {
            local crate="$1"
            echo "::group::cargo publish $crate"
            local out rc
            set +e
            out="$(cargo publish -p "$crate" --locked --no-verify 2>&1)"
            rc=$?
            set -e
            echo "$out"
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "published $crate"
              return 0
            fi
            # crates.io returns this when the exact version already exists.
            # That is the idempotent re-run path (ADR-0025 D5), not an error.
            if echo "$out" | grep -qiE 'already (exists|uploaded)|crate version .* is already'; then
              echo "::notice::$crate $TAG already on crates.io (immutable) — skipping, continuing pipeline (ADR-0025 D5 idempotency)"
              return 0
            fi
            echo "::error::cargo publish $crate failed (not an already-published condition)" >&2
            return "$rc"
          }
          publish_one doiget-core
          publish_one doiget-cli
          publish_one doiget-mcp

  # -------------------------------------------------------------------------
  # d. github-release — create the GitHub Release whose body is EXACTLY the
  #    extracted `## [X.Y.Z]` CHANGELOG section. prerelease iff the tag carries
  #    a SemVer pre-release identifier (a `-`), else latest/stable.
  #
  #    Listed before sign/sbom because they attach artefacts to this Release
  #    (they poll for it). All three only `needs: publish`, so the Release is
  #    created in parallel with sign/sbom, all gated behind a green publish.
  # -------------------------------------------------------------------------
  github-release:
    name: create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write   # create the GitHub Release + tag association
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.TAG }}
      - name: Extract the CHANGELOG section + decide prerelease
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # Strip leading 'v'; the CHANGELOG headings are `## [X.Y.Z]`.
          ver="${TAG#v}"
          # SemVer pre-release ⇔ a '-' in the version (e.g. 0.1.5-beta.1).
          if [[ "$ver" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          # Extract exactly the `## [ver]` section body (everything after the
          # heading line up to, but excluding, the next `## ` heading). This is
          # the same section the version gate (D2-G5) already proved exists and
          # is non-empty, so this never produces an empty Release body.
          awk -v ver="$ver" '
            BEGIN { in_sec = 0 }
            {
              if ($0 ~ /^## \[/) {
                if (in_sec == 1) { exit }
                hv = $0
                sub(/^## \[/, "", hv)
                sub(/\].*$/, "", hv)
                if (hv == ver) { in_sec = 1; next }
              }
              if (in_sec == 1) { print }
            }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::error::extracted CHANGELOG body for $ver is empty — version gate D2-G5 should have prevented this" >&2
            exit 1
          fi
          echo "---- release body ----"
          cat release-body.md
      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          # `gh release create` is idempotent-friendly: if the Release already
          # exists (re-run / dispatch), fall back to `edit`. --verify-tag: the
          # Release must point at the pushed signed tag, not create a new
          # lightweight one.
          if [ "$PRERELEASE" = "true" ]; then
            echo "tag $TAG carries a SemVer pre-release identifier -> prerelease=true (not latest)"
          else
            echo "tag $TAG is a clean SemVer version -> stable, latest=true"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — updating body/flags"
            if [ "$PRERELEASE" = "true" ]; then
              gh release edit "$TAG" --notes-file release-body.md --prerelease
            else
              gh release edit "$TAG" --notes-file release-body.md --latest
            fi
          else
            if [ "$PRERELEASE" = "true" ]; then
              gh release create "$TAG" --title "$TAG" --notes-file release-body.md \
                --verify-tag --target "$TAG" --prerelease
            else
              gh release create "$TAG" --title "$TAG" --notes-file release-body.md \
                --verify-tag --target "$TAG" --latest
            fi
          fi

  # -------------------------------------------------------------------------
  # c. sign — folded in from release-sign.yml (Slice 23). Build the doiget CLI
  #    binary for the three first-class targets, cosign-keyless sign each, and
  #    attach to the Release (polls until github-release has created it).
  # -------------------------------------------------------------------------
  sign:
    name: build + cosign sign (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: publish
    permissions:
      contents: write   # upload signed artefacts to the GitHub Release
      id-token: write   # cosign keyless: mint Fulcio cert from OIDC token
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: doiget-linux-x86_64
            ext: ""
          - os: macos-latest
            artifact: doiget-macos-aarch64
            ext: ""
          - os: windows-latest
            artifact: doiget-windows-x86_64
            ext: ".exe"
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.TAG }}
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Build doiget (release, oa-only)
        shell: bash
        run: |
          # Native target per runner — no cross-compilation, so the produced
          # binary's arch matches the runner. `oa-only` matches the feature
          # surface CI tests/clippy already gate on.
          cargo build --release -p doiget-cli --no-default-features --features oa-only
      - name: Stage binary + checksum
        shell: bash
        run: |
          set -euo pipefail
          src="target/release/doiget${{ matrix.ext }}"
          out="${{ matrix.artifact }}${{ matrix.ext }}"
          cp "$src" "$out"
          # `shasum` is absent on the Windows Git-bash runner and `sha256sum`
          # is absent on macOS; `openssl dgst` is present on all three.
          openssl dgst -sha256 -r "$out" > "$out.sha256"
          echo "ARTIFACT=$out" >> "$GITHUB_ENV"
      - name: cosign sign-blob (keyless)
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "${ARTIFACT}.cosign.bundle" \
            "${ARTIFACT}"
      - name: Wait for the GitHub Release to exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The github-release job (same `needs: publish`) creates the Release
          # in parallel; poll (bounded) so ordering races / re-runs tolerate.
          for i in $(seq 1 20); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release $TAG present"; exit 0
            fi
            echo "release $TAG not yet present (attempt $i/20); waiting 15s"
            sleep 15
          done
          echo "::error::GitHub Release $TAG never appeared after ~5min" >&2
          exit 1
      - name: Upload signed artefacts to the Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "${ARTIFACT}" \
            "${ARTIFACT}.sha256" \
            "${ARTIFACT}.cosign.bundle" \
            --clobber

  # -------------------------------------------------------------------------
  # c. sbom — folded in from release-sbom.yml (Slice 24). CycloneDX SBOM for
  #    the shipped doiget-cli graph, cosign-keyless signed, attached to the
  #    Release.
  # -------------------------------------------------------------------------
  sbom:
    name: cyclonedx SBOM + cosign sign
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write   # upload the SBOM to the GitHub Release
      id-token: write   # cosign keyless: mint Fulcio cert from OIDC token
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.TAG }}
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Install cargo-cyclonedx
        shell: bash
        run: cargo install cargo-cyclonedx --locked
      - name: Generate CycloneDX SBOM for doiget-cli
        shell: bash
        run: |
          set -euo pipefail
          # cargo-cyclonedx has no -p/--features flags (derives the graph from
          # `cargo metadata` over the whole workspace). Run it bare at the
          # workspace root — it emits one `<crate>.cdx.json` per member — then
          # select doiget-cli's bom (it transitively includes doiget-core +
          # doiget-mcp + all deps anyway).
          cargo cyclonedx --format json
          src="$(find . -name '*.cdx.json' -path '*doiget-cli*' | head -n1)"
          if [ -z "$src" ]; then
            src="$(find . -name '*.cdx.json' | head -n1)"
          fi
          if [ -z "$src" ]; then
            echo "::error::no .cdx.json produced by cargo-cyclonedx" >&2
            exit 1
          fi
          out="doiget-sbom-${TAG}.cdx.json"
          cp "$src" "$out"
          openssl dgst -sha256 -r "$out" > "$out.sha256"
          echo "SBOM=$out" >> "$GITHUB_ENV"
      - name: cosign sign-blob (keyless)
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "${SBOM}.cosign.bundle" \
            "${SBOM}"
      - name: Wait for the GitHub Release to exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release $TAG present"; exit 0
            fi
            echo "release $TAG not yet present (attempt $i/20); waiting 15s"
            sleep 15
          done
          echo "::error::GitHub Release $TAG never appeared after ~5min" >&2
          exit 1
      - name: Upload signed SBOM to the Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "${SBOM}" \
            "${SBOM}.sha256" \
            "${SBOM}.cosign.bundle" \
            --clobber
