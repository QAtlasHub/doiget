name: release-sbom

# Phase 6 / Slice 24 — generate + sign a CycloneDX SBOM per release.
#
# ADR-0025 (PR #166): the SBOM logic below is now ALSO folded into
# release-plz.yml as its `sbom` job, which fires on the single workspace tag
# `v*`. To avoid double-firing on a tag (and on the now-retired per-crate
# `doiget-cli-v*` pattern), this workflow's `push: tags: doiget-cli-v*`
# trigger has been REMOVED — it is `workflow_dispatch`-only and exists solely
# as a MANUAL re-SBOM escape hatch for an already-released version (generate a
# CycloneDX SBOM for the `doiget-cli` package — the full transitive dependency
# graph of the SHIPPED binary — cosign-keyless sign it, upload to the matching
# GitHub Release). The routine path is release-plz.yml's `sbom` job; reach for
# this only to regenerate out of band.
#
# Uploads (to the Release named by the dispatch `tag` input):
#   doiget-sbom-<tag>.cdx.json
#   doiget-sbom-<tag>.cdx.json.sha256
#   doiget-sbom-<tag>.cdx.json.cosign.bundle
#
# Verify with:
#   cosign verify-blob \
#     --bundle doiget-sbom-<tag>.cdx.json.cosign.bundle \
#     --certificate-identity-regexp \
#       'https://github.com/QAtlasHub/doiget/.github/workflows/release-sbom.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     doiget-sbom-<tag>.cdx.json

on:
  # push: tags trigger intentionally REMOVED under ADR-0025 (PR #166) — the
  # routine SBOM generation now happens in release-plz.yml's `sbom` job on the
  # single `v*` tag. This workflow is a manual re-SBOM escape hatch only.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)generate the SBOM for (e.g. v0.1.4)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-sbom-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  sbom:
    name: cyclonedx SBOM + cosign sign
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload the SBOM to the GitHub Release
      id-token: write   # cosign keyless: mint Fulcio cert from OIDC token
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Install cargo-cyclonedx
        shell: bash
        run: cargo install cargo-cyclonedx --locked

      - name: Generate CycloneDX SBOM for doiget-cli
        shell: bash
        run: |
          set -euo pipefail
          # cargo-cyclonedx has no `-p` / `--features` flags (it derives
          # the graph from `cargo metadata` over the whole workspace);
          # passing them fails with "unexpected argument". Run it bare
          # at the workspace root — it emits one `<crate>.cdx.json` per
          # member — then select doiget-cli's bom below (it transitively
          # includes doiget-core + doiget-mcp + all deps anyway).
          cargo cyclonedx --format json
          # cargo-cyclonedx writes the bom next to each crate manifest;
          # the exact filename has drifted across versions, so locate
          # doiget-cli's defensively rather than hard-coding.
          src="$(find . -name '*.cdx.json' -path '*doiget-cli*' | head -n1)"
          if [ -z "$src" ]; then
            src="$(find . -name '*.cdx.json' | head -n1)"
          fi
          if [ -z "$src" ]; then
            echo "::error::no .cdx.json produced by cargo-cyclonedx" >&2
            exit 1
          fi
          out="doiget-sbom-${TAG}.cdx.json"
          cp "$src" "$out"
          # `shasum` is absent on the Windows Git-bash runner and
          # `sha256sum` is absent on macOS; `openssl dgst` is present
          # on all three. `-r` gives a `<hash> *<file>` line.
          openssl dgst -sha256 -r "$out" > "$out.sha256"
          echo "SBOM=$out" >> "$GITHUB_ENV"

      - name: cosign sign-blob (keyless)
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "${SBOM}.cosign.bundle" \
            "${SBOM}"

      - name: Wait for the GitHub Release to exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # release-plz creates the `doiget-cli-v<version>` Release on the
          # same tag push that triggered this workflow — short race.
          for i in $(seq 1 20); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release $TAG present"; exit 0
            fi
            echo "release $TAG not yet present (attempt $i/20); waiting 15s"
            sleep 15
          done
          echo "::error::GitHub Release $TAG never appeared after ~5min" >&2
          exit 1

      - name: Upload signed SBOM to the Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "${SBOM}" \
            "${SBOM}.sha256" \
            "${SBOM}.cosign.bundle" \
            --clobber
