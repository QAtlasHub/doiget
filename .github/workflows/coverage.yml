name: coverage

# Workspace line coverage via `cargo-llvm-cov`, uploaded to Codecov.
#
# Non-required check (not in the branch-protection contexts — like
# `build (zola)`); a Codecov hiccup must not block a merge, so the upload
# is `fail_ci_if_error: false`. Runs on every PR and on pushes to the two
# long-lived lanes (`main`, `next`) so Codecov has a base to diff PRs
# against. Covers `oa-only` plus the Tier-3 TDM features: that code used to
# be excluded as "not the default surface", which held while nothing called
# it. Since #442 wired it into the production fetch path it is ordinary
# reachable code, and leaving it out would report new Tier-3 lines as
# uncovered while never measuring the tests that do cover them.
#
# All third-party Actions are SHA-pinned (repo invariant, ADR-0013):
# checkout / rust-toolchain / rust-cache reuse the SHAs already pinned in
# ci.yml; codecov-action and install-action SHAs were resolved from their
# release tags. `CODECOV_TOKEN` is a repo secret (Codecov is connected).

on:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

jobs:
  coverage:
    name: llvm-cov + codecov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91  # v2.87.31
        with:
          tool: cargo-llvm-cov
      - name: Generate workspace coverage (lcov)
        run: cargo llvm-cov --workspace --locked --features tdm-aps,tdm-elsevier,tdm-springer,tdm-ieee --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
