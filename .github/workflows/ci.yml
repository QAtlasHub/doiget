name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }} / ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features:
          - "oa-only"
          - "oa-only,citation"
          # Tier 3 (ADR-0002). Opt-in builds only, so nothing here ever
          # reaches a published binary — but until this entry existed the
          # three `tdm-*` modules were compiled by NO job at all, and could
          # have rotted silently. The union matches the documented install
          # shape (`SOURCES.md` §3); the singleton proves `tdm-*` does not
          # secretly depend on `metadata`.
          - "oa-only,metadata,tdm-aps,tdm-elsevier,tdm-springer,tdm-ieee"
          - "oa-only,tdm-aps"
          # #460: `tdm-ieee` alone did not compile — `TdmGrant::api_key`
          # is gated on an `any(...)` that listed the first three
          # publishers and not the fourth, and the union job hid it
          # because the others were always present. One singleton is not
          # enough; each new publisher needs its own.
          - "oa-only,tdm-ieee"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # rust-cache v2.9 turned `cache-bin: true` on by default. The
          # macOS-arm64 cache slot has captured a poisoned
          # `~/.cargo/bin/cargo` (resolves to `rustup-init`, so
          # `cargo test ...` fails with `unexpected argument 'test'`).
          # `dtolnay/rust-toolchain` above already installs cargo fresh;
          # we don't want a stale binary cache restored over it.
          # `target/` and the registry stay cached as before.
          cache-bin: false
      - name: clippy
        run: cargo clippy --workspace --all-targets --no-default-features --features "${{ matrix.features }}" -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # See clippy job above for the cache-bin rationale (macOS-arm64
          # cache slot shadows the freshly-installed cargo with rustup-init).
          cache-bin: false
      # Aligned with clippy job: --no-default-features --features oa-only,
      # so test and clippy exercise an identical feature surface.
      - run: cargo test --workspace --all-targets --no-default-features --features oa-only

  test-citation:
    name: test (citation feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-bin: false
      # #373: the released binaries (and the .mcpb) ship with
      # --features citation, so exercise that surface here — the default
      # `test` job above runs oa-only only, leaving the citation tool +
      # citation_graph e2e test unvalidated.
      - run: cargo test --workspace --all-targets --no-default-features --features oa-only,citation

  test-tdm:
    name: test (tdm features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-bin: false
      # The Tier-3 tests (~1100 lines of wiremock coverage across
      # tdm_springer / tdm_aps / tdm_elsevier) ran in NO CI job before this.
      # They are the only thing standing between a credential-handling
      # source and a silent regression, so they have to actually run.
      - run: cargo test --workspace --all-targets --no-default-features --features oa-only,metadata,tdm-aps,tdm-elsevier,tdm-springer,tdm-ieee
      # #458: the union job above cannot see a publisher missing from the
      # chain's `#[cfg]` gate, because the other three satisfy it. That is
      # how `tdm-ieee` shipped with `resolve_tdm_chain` compiled out from
      # under it — source, allowlist, grant and docs all present, and no
      # code left that calls any of them.
      #
      # One singleton per publisher, ubuntu only: the reach test is
      # `any(...)`-gated so each build exercises exactly the publisher it
      # compiled, and a missing gate is a compile error rather than a
      # silent no-op.
      - name: Tier-3 singletons (each publisher alone)
        run: |
          for f in tdm-aps tdm-elsevier tdm-springer tdm-ieee; do
            echo "::group::oa-only,$f"
            cargo test -p doiget-core --no-default-features --features "oa-only,$f"
            echo "::endgroup::"
          done

  msrv:
    # MSRV is pinned in rust-toolchain.toml / Cargo.toml; the job name
    # deliberately omits the version literal so the label cannot drift.
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo build --workspace --no-default-features --features oa-only

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --no-default-features --features oa-only
      # The `citation` surface was never doc-built, so two broken intra-doc
      # links sat latent on `main` and the five 0.8.8 sources could add more
      # without CI noticing. Release binaries ship `oa-only,citation`, so the
      # docs for that surface have to build too.
      - run: cargo doc --workspace --no-deps --no-default-features --features oa-only,citation
      # Same reasoning for Tier 3: these modules carry the longest
      # doc-comments in the tree (three-gate activation, credential
      # hygiene) and none of it was ever rendered.
      - run: cargo doc --workspace --no-deps --no-default-features --features oa-only,metadata,tdm-aps,tdm-elsevier,tdm-springer,tdm-ieee
