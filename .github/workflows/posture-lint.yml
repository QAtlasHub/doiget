name: posture-lint

# Enforces docs/LEGAL.md §6 safeguard 5 (no marketing-violation language) and
# ADR-0001 / ADR-0015 (no HTTP server / telemetry / self-update imports).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Forbidden marketing terms in user-facing copy
        shell: bash
        run: |
          set -euo pipefail
          # Scope: README.md only. The LEGAL / SCOPE / CONTACT / CONTRIBUTING
          # docs legitimately need to use these words to describe the policy
          # (e.g., "doiget does not bypass paywalls"). README is the front-page
          # marketing surface where positive uses must be caught. Rephrase any
          # flagged term in README rather than relaxing this rule.
          PATTERN='\b(bypass|circumvent|free papers|sci-?hub)\b'
          if grep -i -n -E "$PATTERN" README.md ; then
            echo "::error::posture-lint: forbidden marketing term detected in README.md"
            exit 1
          fi

      - name: Forbidden HTTP server imports
        shell: bash
        run: |
          set -euo pipefail
          # Case-insensitive: idiomatic Rust imports `hyper::Server` (capital S);
          # we must catch that as well as `hyper::server` (module form).
          PATTERN='use[[:space:]]+(axum|actix_web|warp|tide|rocket|poem|salvo)|use[[:space:]]+hyper::[Ss]erver'
          if grep -r -E "$PATTERN" --include='*.rs' crates/ ; then
            echo "::error::posture-lint: HTTP server crate imported (ADR-0001)"
            exit 1
          fi

      - name: Forbidden telemetry / self-update imports
        shell: bash
        run: |
          set -euo pipefail
          PATTERN='use[[:space:]]+(sentry|posthog|self_update|google_analytics)'
          if grep -r -E "$PATTERN" --include='*.rs' crates/ ; then
            echo "::error::posture-lint: telemetry / self-update crate imported (ADR-0015)"
            exit 1
          fi

      - name: Forbidden TLS backend imports (rustls only)
        shell: bash
        run: |
          set -euo pipefail
          PATTERN='use[[:space:]]+(openssl|native_tls)'
          if grep -r -E "$PATTERN" --include='*.rs' crates/ ; then
            echo "::error::posture-lint: openssl/native_tls imported; use rustls (deny.toml)"
            exit 1
          fi

      - name: CapabilityProfile::from_env in tests must be serialised (#456)
        shell: bash
        run: |
          set -euo pipefail
          # `from_env()` reads process-global env. A test that calls it races
          # any `#[serial]` test holding `DOIGET_KEY_*` without its agreement
          # var, and loses with `KeyButNotAgreed` — `#[serial]` on the WRITER
          # serialises marked tests against each other and does nothing about
          # unmarked readers. It also makes the suite fail on a developer
          # machine that exports `DOIGET_KEY_ELSEVIER`.
          #
          # So outside `lib.rs` (which owns the env-resolution tests), a file
          # that calls `from_env()` must also carry `serial`. Tests that only
          # want a default profile use `CapabilityProfile::for_tests()`, which
          # reads no environment at all.
          bad=0
          while IFS= read -r f; do
            [ "$f" = "crates/doiget-core/src/lib.rs" ] && continue
            if ! grep -q 'serial' "$f"; then
              echo "::error file=$f::posture-lint: calls CapabilityProfile::from_env() with no #[serial] in the file; use CapabilityProfile::for_tests() for a default profile (#456)"
              bad=1
            fi
          done < <(grep -rl 'CapabilityProfile::from_env()' --include='*.rs' crates/doiget-core/src || true)
          [ "$bad" -eq 0 ]

      - name: LICENSE is verbatim SPDX MIT (no trailing prose)
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's `licensee` classifies the repo as MIT only if LICENSE is
          # (near-)verbatim SPDX MIT. Trailing prose (e.g. a `---` separator +
          # a `Note:` paragraph) drops the similarity below threshold, so the
          # repo reports `licenseInfo: Other` — which propagates to crates.io,
          # SPDX scanners and shields. Keep posture/legal text in
          # docs/LEGAL.md + the site posture page, never in LICENSE. See #157.
          if [ "$(head -n1 LICENSE)" != "MIT License" ]; then
            echo "::error::posture-lint: LICENSE line 1 must be exactly 'MIT License' (#157)"
            exit 1
          fi
          if grep -nE '^(---|Note:)' LICENSE ; then
            echo "::error::posture-lint: LICENSE has non-SPDX trailing prose ('---' / 'Note:'). Keep LICENSE verbatim SPDX MIT; posture text belongs in docs/LEGAL.md (#157)"
            exit 1
          fi
          last_content="$(grep -n . LICENSE | tail -n1 | cut -d: -f1)"
          software_line="$(grep -n '^SOFTWARE\.$' LICENSE | tail -n1 | cut -d: -f1 || true)"
          if [ -z "$software_line" ] || [ "$last_content" != "$software_line" ]; then
            echo "::error::posture-lint: content found after the SPDX MIT body (it must end at the line 'SOFTWARE.') — LICENSE is not verbatim MIT (#157)"
            exit 1
          fi
          if grep -qU $'\r' LICENSE ; then
            echo "::error::posture-lint: LICENSE has CRLF line endings; must be LF for licensee (#157)"
            exit 1
          fi
          echo "LICENSE OK: verbatim SPDX MIT, no trailing prose, ends at SOFTWARE., LF."

      - name: MCP_TOOLS.md lists exactly the tools the router exposes (#553)
        shell: bash
        run: |
          set -euo pipefail
          # `MCP_TOOLS.md` is what an integrator reads to decide what the server
          # can do, and `docs/INTEGRATION/*.md` points at it. Nothing checked it
          # against the router, and it had drifted in BOTH directions at once:
          # four tools shipped with no entry (#553), and one had an entry while
          # not shipping at all (#552). Neither is visible from inside the other
          # file.
          #
          # rmcp derives a tool's name from its `#[tool]` method name, so the
          # method list is the router's own truth. Compared against the table
          # rows, which are the document's.
          fns="$(grep -oE '^[[:space:]]+(pub )?async fn doiget_[a-z_0-9]+' \
                 crates/doiget-mcp/src/lib.rs \
                 | grep -oE 'doiget_[a-z_0-9]+' | sort -u)"
          rows="$(grep -oE '^\| .doiget_[a-z_0-9]+.' docs/MCP_TOOLS.md \
                  | grep -oE 'doiget_[a-z_0-9]+' | sort -u)"
          if [ -z "$fns" ] || [ -z "$rows" ]; then
            echo "::error::posture-lint mcp-tools: read no tools from the router or no rows from MCP_TOOLS.md — one of the two patterns has stopped matching (#553)"
            exit 1
          fi
          missing="$(comm -23 <(printf '%s\n' "$fns") <(printf '%s\n' "$rows"))"
          extra="$(comm -13 <(printf '%s\n' "$fns") <(printf '%s\n' "$rows"))"
          fail=0
          if [ -n "$missing" ]; then
            echo "::error::posture-lint mcp-tools: these tools ship but have no row in docs/MCP_TOOLS.md (#553)"
            printf '  %s\n' $missing
            fail=1
          fi
          if [ -n "$extra" ]; then
            echo "::error::posture-lint mcp-tools: docs/MCP_TOOLS.md documents these, but the router has no such tool (#552)"
            printf '  %s\n' $extra
            fail=1
          fi
          [ "$fail" -eq 0 ]
          echo "MCP_TOOLS.md and the router agree on $(printf '%s\n' "$fns" | wc -l | tr -d ' ') tools"

      - name: doiget-cli forwards every doiget-mcp feature (#373 / #516)
        shell: bash
        run: |
          set -euo pipefail
          # `doiget serve` runs `doiget-mcp` code, and `doiget-mcp` reads its
          # OWN `cfg!(feature = ...)`. So a `doiget-cli` feature that forwards
          # only to `doiget-core` leaves the MCP surface behind.
          #
          # Not hypothetical: `citation` did exactly this, and the release
          # binary — built `-p doiget-cli --features oa-only,citation` so the
          # graph tool would ship (#373) — advertised 21 tools instead of 22,
          # while `doiget graph` and `capability_profile` both reported the
          # citation graph as available.
          #
          # The whole test matrix missed it. CI builds with `--workspace
          # --features oa-only,citation`, which enables the feature on
          # `doiget-mcp` DIRECTLY; only a `-p doiget-cli` build goes through
          # the forwarding. So this is checked structurally, where the defect
          # lives, rather than by a feature-flagged test that cannot see it.
          mcp_features="$(awk '/^\[features\]/{f=1;next} /^\[/{f=0} f && /^[a-z][a-z0-9-]*[[:space:]]*=/{sub(/[[:space:]]*=.*/,""); print}' \
                          crates/doiget-mcp/Cargo.toml | grep -v '^default$' | sort -u)"
          if [ -z "$mcp_features" ]; then
            echo "::error::posture-lint features: read no [features] from crates/doiget-mcp/Cargo.toml"
            exit 1
          fi
          fail=0
          for f in $mcp_features; do
            line="$(grep -E "^${f}[[:space:]]*=" crates/doiget-cli/Cargo.toml || true)"
            if [ -z "$line" ]; then
              echo "::error::posture-lint features: doiget-mcp has feature '${f}' but doiget-cli has none of that name, so nothing can enable it in a '-p doiget-cli' build"
              fail=1
              continue
            fi
            if ! printf '%s' "$line" | grep -q "doiget-mcp/${f}"; then
              echo "::error::posture-lint features: doiget-cli's '${f}' does not forward to doiget-mcp/${f} — 'doiget serve' will behave as if the feature is off (#373)"
              printf '  %s\n' "$line"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]
          echo "doiget-cli forwards every doiget-mcp feature: $(echo "$mcp_features" | tr '\n' ' ')"

      - name: npm platform packages cover every release binary (#511)
        shell: bash
        run: |
          set -euo pipefail
          # The npm `os`/`cpu` names (darwin/win32, x64/arm64) and the release
          # asset names (macos/windows, x86_64/aarch64) are different
          # vocabularies for the same four targets, so the mapping is written
          # twice: `scripts/stage-npm.sh` (MAP) and `npm/doiget-cli/bin/platform.js`
          # (PACKAGES). Two hand-maintained copies of one table is the #454 /
          # #504 shape, so it is checked rather than trusted.
          #
          # Third copy, and the one that moves: the `sign` matrix in
          # release-plz.yml. A new target added there with no npm package
          # would publish a wrapper that cannot run on it.
          #
          # `capture` exists because each of these greps is itself a silent
          # failure waiting to happen: under `set -euo pipefail` a grep that
          # matches nothing exits 1 and kills the step with NO output at all.
          # Not hypothetical — the PACKAGES table moved from `doiget.js` to
          # `platform.js` and this step went red with an empty log, which
          # reads as infrastructure flake rather than as the drift it was
          # actually detecting.
          capture() {
            local out
            out="$(grep -oE "$1" "$2" || true)"
            if [ -z "$out" ]; then
              echo "::error::posture-lint npm: /$1/ matched nothing in $2 — the table it reads has moved or been renamed (#511)"
              exit 1
            fi
            printf '%s\n' "$out"
          }
          assets="$(capture 'artifact: doiget-[a-z0-9_.-]+' .github/workflows/release-plz.yml \
                    | sed 's/artifact: //' | sort -u)"
          staged="$(capture '^doiget-[a-z0-9-]+:doiget-[a-z0-9_.-]+:' scripts/stage-npm.sh \
                    | cut -d: -f2 | sort -u)"
          shimmed="$(capture '"doiget-(darwin|linux|win32)-[a-z0-9]+"' npm/doiget-cli/bin/platform.js \
                     | tr -d '"' | sort -u)"
          pkgs="$(capture '^doiget-[a-z0-9-]+:' scripts/stage-npm.sh | tr -d ':' | sort -u)"

          fail=0
          # `.exe` is appended by the matrix `ext:` field, so compare stems.
          if [ "$(echo "$assets" | sed 's/\.exe$//' | sort -u)" \
               != "$(echo "$staged" | sed 's/\.exe$//' | sort -u)" ]; then
            echo "::error::posture-lint npm: release-plz.yml assets and scripts/stage-npm.sh disagree (#511)"
            printf 'release-plz.yml:\n%s\nstage-npm.sh:\n%s\n' "$assets" "$staged"
            fail=1
          fi
          if [ "$pkgs" != "$shimmed" ]; then
            echo "::error::posture-lint npm: scripts/stage-npm.sh and npm/doiget-cli/bin/platform.js name different packages (#511)"
            printf 'stage-npm.sh:\n%s\nshim:\n%s\n' "$pkgs" "$shimmed"
            fail=1
          fi
          # Every package the wrapper declares must exist as a directory, and
          # vice versa — an optionalDependency that resolves to nothing fails
          # SILENTLY at install time, which is the whole failure mode.
          declared="$(capture '"doiget-(darwin|linux|win32)-[a-z0-9]+"' npm/doiget-cli/package.json \
                      | tr -d '"' | sort -u)"
          # `! -name doiget-cli` because the wrapper now matches `doiget-*`
          # too. Without it the wrapper's own directory joins the list of
          # platform packages and this check fails on every run.
          onDisk="$(find npm -maxdepth 1 -mindepth 1 -type d -name 'doiget-*' ! -name 'doiget-cli' -printf '%f\n' | sort -u)"
          if [ "$declared" != "$onDisk" ]; then
            echo "::error::posture-lint npm: optionalDependencies and npm/ directories disagree (#511)"
            printf 'package.json:\n%s\nnpm/:\n%s\n' "$declared" "$onDisk"
            fail=1
          fi
          # Without this edge the checks form TWO disjoint clusters —
          # {assets,staged} and {pkgs,shimmed} versus {declared,onDisk} — so
          # renaming both halves consistently but differently from each other
          # passed every check while the wrapper depended on a package the
          # staging script never produces.
          if [ "$pkgs" != "$declared" ]; then
            echo "::error::posture-lint npm: scripts/stage-npm.sh and npm/doiget-cli/package.json name different packages (#511)"
            printf 'stage-npm.sh:\n%s\npackage.json:\n%s\n' "$pkgs" "$declared"
            fail=1
          fi
          [ "$fail" -eq 0 ]
          echo "npm mapping OK: $(echo "$pkgs" | tr '\n' ' ')"

      - name: release checksum verification test (#511)
        shell: bash
        run: bash npm/doiget-cli/test/release-checksums.test.sh

      - name: Homebrew formula is generator output (#501)
        shell: bash
        # `Formula/doiget.rb` is generated from a release's published `.sha256`
        # assets. #247 was closed as completed while four fifths of it had not
        # shipped, so the formula is asserted rather than trusted: this fails on
        # a hand-edit, a bad checksum, or a tag/version confusion.
        run: bash scripts/update-homebrew-formula.test.sh

      - name: npm packaging tests (#511)
        shell: bash
        # The name-list greps above cannot catch a wrong binary name, a
        # mis-forwarded exit code, or a staging script that produces the
        # wrong layout. These actually run. node is preinstalled on the
        # runner, so no action is pinned for it.
        run: |
          set -euo pipefail
          node npm/doiget-cli/test/platform.test.js
          bash npm/doiget-cli/test/stage-npm.test.sh

  network-purity:
    # Phase 0 must make zero outbound network calls from the unit / integration
    # test suite. See `docs/PHASES.md` §3 working principle ("No external
    # services touched") and `docs/SECURITY.md` §1.10 (network side channel).
    # Phase 1 will introduce real fetches behind explicit, mocked, or
    # `#[ignore]`'d tests; this job pins the Phase-0 contract so a regression
    # is caught at PR review rather than at runtime on a sandboxed runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Every hand-built error object carries a disposition (#506)
        shell: bash
        run: |
          set -euo pipefail
          # `error_object` builds most failure envelopes, but five are assembled
          # field-by-field with `insert("code", ...)` because they also attach a
          # `denial_context`. The first pass at #506 converted the former and
          # missed the latter -- including the two most common failures an agent
          # sees -- so `disposition` shipped present on some failures and absent
          # on others, which is worse than absent everywhere.
          #
          # One `insert("disposition"` per `insert("code"`. Not a proof, but it
          # fails on exactly the mistake that was made.
          f=crates/doiget-mcp/src/lib.rs
          codes="$(grep -c 'insert("code"' "$f")"
          disps="$(grep -c 'insert("disposition"' "$f")"
          if [ "$codes" != "$disps" ]; then
            echo "::error::posture-lint: $codes hand-built error objects but $disps dispositions in $f - a failure envelope is missing error.disposition (#506)"
            grep -n 'insert("code"' "$f"
            exit 1
          fi

      - name: Host adjudication uses `permits`, never `matches` (#533)
        shell: bash
        run: |
          set -euo pipefail
          # `SourceAllowlist::matches` answers "is this host on the list".
          # `SourceAllowlist::permits` answers "may we go here", which is what
          # every gate is actually asking -- and it is the one that treats a
          # DOI resolver as addressing rather than as a content host.
          #
          # #533 was a gate that asked the first question and acted on the
          # answer: a gold-OA cc-by paper was refused at `doi.org`, one hop
          # before the publisher whose host was already allowlisted. There
          # were FIVE such gates and only one of them was ever walked end to
          # end, which is #462's point exactly ("every 'unreachable source'
          # bug passed its unit tests").
          #
          # The discriminator: adjudication passes a host VARIABLE
          # (`.matches(&host)`); list-membership assertions in tests pass a
          # LITERAL (`.matches("doaj.org")`). So a `.matches(&` anywhere is a
          # gate that should be a `permits`.
          if grep -rn --include='*.rs' '\.matches(&' crates/ ; then
            echo "::error::posture-lint: host adjudication must call permits(), not matches() - see http::is_transparent_resolver (#533)"
            exit 1
          fi

      - name: No outbound-network APIs in unit / integration tests
        shell: bash
        run: |
          set -euo pipefail
          # Scope:
          #   - crates/*/src/**/*.rs   (unit tests live in `#[cfg(test)] mod tests`)
          #   - crates/*/tests/**/*.rs (integration tests)
          # Out-of-scope (allowed to use real HTTP):
          #   - crates/*/benches/**    (benchmarks may hit real services for warmup)
          #
          # Escape hatch for legitimate uses (e.g., a future mock harness that
          # legitimately re-exports `reqwest::Client`): a file may opt out by
          # setting its FIRST line to the literal:
          #
          #     // allow: outbound-network
          #
          # This must be the very first line of the file so reviewers see it
          # immediately at the top of any diff.
          #
          # Patterns are fixed strings (`grep -F`) where possible; otherwise
          # anchored to disallow `// reqwest::` style commented imports.
          FIXED_PATTERNS=(
            'reqwest::'
            'hyper::client'
            'std::net::TcpStream'
            'std::net::UdpSocket'
            'tokio::net::TcpStream'
            'tokio::net::UdpSocket'
            'socket2::'
          )

          # Collect candidate files: unit-test sources + integration tests,
          # excluding benches.
          mapfile -t FILES < <(
            find crates -type f -name '*.rs' \
              \( -path 'crates/*/src/*' -o -path 'crates/*/tests/*' \) \
              -not -path 'crates/*/benches/*'
          )

          fail=0
          for f in "${FILES[@]}"; do
            # Escape hatch: skip files whose first line opts out.
            first_line="$(head -n1 "$f" || true)"
            if [ "$first_line" = "// allow: outbound-network" ]; then
              continue
            fi
            for pat in "${FIXED_PATTERNS[@]}"; do
              # We only care whether the import is real, not commented out.
              # The regex `^[[:space:]]*[^/[:space:]]` asserts the line begins
              # with non-comment, non-whitespace content; we then `grep -F`
              # the literal pattern over those lines.
              if matches="$(grep -nE '^[[:space:]]*[^/[:space:]].*' "$f" | grep -F "$pat" || true)"; then
                if [ -n "$matches" ]; then
                  echo "::error file=$f::posture-lint network-purity: forbidden API '$pat' found in test source"
                  echo "$matches" | sed "s|^|    $f:|"
                  fail=1
                fi
              fi
            done
          done

          if [ "$fail" -ne 0 ]; then
            echo
            echo "::error::posture-lint network-purity: outbound-network APIs detected in unit/integration tests."
            echo "Phase 0 forbids real network calls in the test suite; see"
            echo "  - .github/workflows/posture-lint.yml (this job)"
            echo "  - docs/PHASES.md §3 (working principle: \"No external services touched\")"
            echo "If this use is legitimate (e.g., a mock harness that re-exports a"
            echo "network type), opt the file out by setting its first line to:"
            echo "    // allow: outbound-network"
            exit 1
          fi
