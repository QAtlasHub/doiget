name: audit

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/audit.yml"
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"   # weekly on Monday 07:00 UTC

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7.0.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # Audit only the published surface (oa-only). TDM features are
          # opt-in user builds per ADR-0002 and never published; they pull in
          # extra deps that would falsely pass through this audit.
          # Aligns with `[graph] all-features = false` in deny.toml.
          arguments: --workspace --no-default-features --features oa-only

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # node24 (master, "Update to use Node 24" #48; v2.0.0 was the GitHub-deprecated node20)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # When the weekly cron fails, GitHub Actions does not email by default for
  # scheduled-only failures on inactive repos. Open a tracking issue instead
  # so the failure is visible and durable. PR / push failures already surface
  # in the normal Checks UI; this job is gated on schedule events only.
  notify-cron-failure:
    name: notify (cron failure)
    needs: [cargo-deny, cargo-audit]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "audit: scheduled run failed ($(date -u +%Y-%m-%d))" \
            --label "ci,audit,automated" \
            --body "The scheduled \`audit\` workflow failed. See ${RUN_URL} for details. This issue was opened automatically; close it once the underlying advisory is triaged or resolved." \
            --repo "${{ github.repository }}"
